name: Fase 9 Etapa 6 - Corrección temporal de enlaces

on:
  push:
    branches: [fase-9-etapa-6-enlazado-interno]
    paths:
      - '.github/workflows/fase-9-etapa-6-links-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener rama controlada
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fase-9-etapa-6-enlazado-interno

      - name: Aplicar únicamente los dos enlaces faltantes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path('index.html')
          text = home.read_text(encoding='utf-8')
          old = '<nav><h2>Enlaces</h2><p><a href="https://crebeucayali.github.io/">Inicio principal EVA</a><br><a href="https://crebeucayali.github.io/capacitaciones/">Capacitaciones CREBE</a><br><a href="articulos/lanzamiento-eva/">Artículo sobre el lanzamiento de EVA</a></p></nav>'
          new = '<nav><h2>Enlaces</h2><p><a href="https://crebeucayali.github.io/">Inicio principal EVA</a><br><a href="articulos/">Todos los artículos de Lecturas Inclusivas</a><br><a href="https://crebeucayali.github.io/capacitaciones/">Capacitaciones CREBE</a><br><a href="articulos/lanzamiento-eva/">Artículo sobre el lanzamiento de EVA</a></p></nav>'
          assert text.count(old) == 1, 'Marcador del pie de portada no encontrado de forma única'
          home.write_text(text.replace(old, new, 1), encoding='utf-8')

          articles = Path('articulos/index.html')
          text = articles.read_text(encoding='utf-8')
          marker = '      </article>\n    </section>\n  </main>'
          insertion = '''      </article>\n      <article class="tarjeta tarjeta-separada">\n        <div class="contenido">\n          <p class="etiqueta">Investigación e información · 11 de julio de 2026</p>\n          <h2>Transición a la vida adulta</h2>\n          <p>Experiencias de familias y docentes ante el egreso de estudiantes de Educación Básica Especial.</p>\n          <a class="boton" href="transicion-vida-adulta/">Leer artículo</a>\n        </div>\n      </article>\n    </section>\n  </main>'''
          assert text.count(marker) == 1, 'Marcador final del índice de artículos no encontrado de forma única'
          articles.write_text(text.replace(marker, insertion, 1), encoding='utf-8')
          PY

      - name: Confirmar alcance y publicar
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$files" = "articulos/index.html index.html "
          git config user.name "CREBE SEO controlled automation"
          git config user.email "senordelosmilagroscrebe@gmail.com"
          git add index.html articulos/index.html
          git commit -m "Fase 9 Etapa 6: conectar índice y artículo huérfano"
          git push origin HEAD:fase-9-etapa-6-enlazado-interno
